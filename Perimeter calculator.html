<!DOCTYPE html>
<html>

<head>
    <title>Calculator</title>
</head>

<body>
    <script>
        var choice = prompt("Welcome to perimeter calculator.\n Please enter your choice .\n 1. Perimeter of rectangle.\n 2. Perimeter of triangle .\n 3. Perimeter of circle . \n 4. Perimeter of parallelogram ");
        if (choice == "1") {
            var l = prompt('Enter the length')
            var b = prompt('Enter the breadth')
            var result = Number(l) * Number(b)
            alert("The perimeter is " + result)
        }
        if (choice == "2") {
            var l = prompt('Enter the length')
            var b = prompt('Enter the base')
            var result = Number(l) * Number(b) / 2
            alert("The perimeter is " + result)
        }
        if (choice == "3") {
            var l = prompt('Enter the radius')
            var result = 3.14 * Number(l) * Number(l)
            alert("The perimeter is " + result)
        }
        if (choice == "4") {
            var l = prompt('Enter the length')
            var b = prompt('Enter the corresponding base')
            var result = Number(l) * Number(b)
            alert("The perimeter is " + result)
        }
    </script>

</body>

</html>
